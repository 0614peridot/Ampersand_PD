<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampersand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #f5f5f5;
      color: #212121;
      overflow-x: hidden;
    }

    /* ========== TOP BAR ========== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #f5f5f5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 72px;
      padding: 0 80px 8px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .top-bar.hidden {
      transform: translateY(-100%);
    }

    .top-bar-menu {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
    }

    .logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 28px;
      letter-spacing: -1.4px;
      color: #212121;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: color 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .logo:hover {
      color: #737373;
    }

    .auth-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      min-width: 96px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: -0.32px;
      line-height: 22px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-light {
      background: #f5f5f5;
      color: #212121;
      transition: color 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-light:hover {
      color: #737373;
    }

    .btn-dark {
      background: #212121;
      color: #fff;
      transition: background-color 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-dark:hover {
      background: #737373;
    }

    /* ========== HERO SECTION ========== */
    .hero {
      background: #212121;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 200px 80px;
      width: 100%;
      min-height: 100vh;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding-top: 80px;
      width: 500px;
      max-width: 100%;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      text-align: center;
      width: 100%;
    }

    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      font-size: clamp(56px, calc(56px + (70 - 56) * ((100vw - 1101px) / (1440 - 1101))), 70px);
      line-height: 1.2;
      letter-spacing: -1.4px;
      color: #fff;
      width: 100%;
    }

    .hero-title span {
      color: #f5f5f5;
    }

    .hero-subtitle {
      font-family: 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 20px;
      line-height: 40px;
      letter-spacing: -0.4px;
      color: #e7e7e7;
      width: 100%;
    }

    /* CTA Button */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      padding: 0 80px;
      border-radius: 1000px;
      border: none;
      font-family: 'Pretendard', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 35px;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: box-shadow 500ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cta-yellow {
      background: #fdf2b4;
      color: #212121;
      width: 280px;
    }

    .cta-yellow:hover {
      background: #fff;
    }

    .cta-black {
      background: #212121;
      color: #fff;
      font-weight: 600;
    }

    .cta-black:hover {
      background: #737373;
    }

    /* ========== MEMBERS SECTION ========== */
    .members-section {
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 120px 80px;
      width: 100%;
    }

    .members-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      max-width: 1080px;
      width: 100%;
    }

    .members-header {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      align-items: flex-start;
      width: 100%;
    }

    .members-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 400px;
    }

    .members-title {
      font-weight: 700;
      font-size: 28px;
      line-height: 1.5;
      color: #212121;
    }

    .members-desc {
      font-weight: 500;
      font-size: 16px;
      line-height: 22px;
      letter-spacing: -0.32px;
      color: #737373;
    }

    .members-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .search-btn svg {
      width: 24px;
      height: 24px;
    }

    /* ========== CARD LIST ========== */
    .card-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 20px 40px;
      flex: 1 0 0;
      min-width: 260px;
      max-width: 400px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
    }

    .card-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .card-top {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-name {
      font-weight: 600;
      font-size: 20px;
      line-height: 22px;
      color: #212121;
    }

    .detail-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .detail-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .detail-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #DCDCDC;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #fdf2b4;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 14px;
      line-height: 22px;
      color: #212121;
      white-space: nowrap;
    }

    .card-divider {
      width: 100%;
      height: 1px;
      background: #dcdcdc;
    }

    .card-goal {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-goal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-goal-title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.5;
      color: #212121;
    }

    .edit-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .edit-btn svg {
      width: 24px;
      height: 24px;
    }

    .card-goal-text {
      font-weight: 500;
      font-size: 14px;
      line-height: 1.5;
      color: #737373;
      max-width: 360px;
      width: 100%;
    }

    /* ========== RESPONSIVE: tablet (768px - 1100px) ========== */
    @media (max-width: 1100px) {
      .top-bar {
        padding: 0 40px 8px;
      }

      .hero {
        padding: 200px 40px;
      }

      .hero-title {
        font-size: clamp(40px, calc(40px + (56 - 40) * ((100vw - 500px) / (768 - 500))), 56px);
      }

      .members-section {
        padding: 120px 40px;
      }
    }

    /* ========== RESPONSIVE: mobile (under 768px) ========== */
    @media (max-width: 767px) {
      .top-bar {
        height: auto;
        padding: 44px 16px 4px 16px;
        align-items: center;
      }

      .logo {
        font-size: 24px;
        letter-spacing: -1.2px;
      }

      .auth-buttons {
        gap: 4px;
      }

      .btn.auth-btn {
        height: 32px;
        min-width: auto;
        font-size: 14px;
        letter-spacing: -0.28px;
        line-height: 18px;
      }

      .btn-light.auth-btn {
        width: 68px;
      }

      .btn-dark.auth-btn {
        width: 80px;
      }

      .hero {
        padding: 120px 16px;
        min-height: 800px;
      }

      .hero-content {
        gap: 100px;
        padding-top: 0;
        width: 100%;
      }

      .hero-text {
        gap: 32px;
      }

      .hero-title {
        font-size: clamp(40px, calc(40px + (56 - 40) * ((100vw - 500px) / (768 - 500))), 56px);
        letter-spacing: -0.8px;
      }

      .hero-subtitle {
        font-size: 18px;
        line-height: 32px;
        letter-spacing: -0.36px;
      }

      .cta-yellow {
        width: 100%;
      }

      .members-section {
        padding: 80px 16px;
      }

      .members-header {
        flex-direction: column;
        gap: 32px;
      }

      .members-text {
        min-width: 0;
      }

      .members-title {
        font-size: 24px;
      }

      .members-desc {
        font-size: 15px;
        line-height: 21px;
        letter-spacing: -0.3px;
      }

      .members-actions {
        width: 100%;
      }

      .search-btn {
        flex: 1;
        width: auto;
        justify-content: flex-start;
        padding: 0 12px;
        border-radius: 8px;
        height: 40px;
      }

      .card {
        max-width: none;
      }

      .cta-black {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar" id="topBar">
    <div class="top-bar-menu">
      <a class="logo" href="#">Ampersand</a>
      <div class="auth-buttons">
        <button class="btn btn-light auth-btn">로그인</button>
        <button class="btn btn-dark auth-btn">회원가입</button>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-title">
          Ampersand<br>
          <span>Design System</span><br>
          <span>Assignment</span>
        </div>
        <p class="hero-subtitle">앰퍼샌드와 함께 디자인시스템 과제를 해봐요!</p>
      </div>
      <button class="cta-btn cta-yellow">지금 시작하기</button>
    </div>
  </section>

  <!-- MEMBERS SECTION -->
  <section class="members-section">
    <div class="members-content">
      <div class="members-header">
        <div class="members-text">
          <h2 class="members-title">프로덕트 디자인 부원</h2>
          <div class="members-desc">
            <p>부원 목록을 관리하고, 학습 목표를 리마인드하세요.</p>
            <p>부원이 작성한 기록을 참고해 학회의 커리큘럼을 조정하세요.</p>
          </div>
        </div>
        <div class="members-actions">
          <button class="search-btn" aria-label="검색">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="10" r="6" stroke="#737373" stroke-width="2"/>
              <line x1="15.5" y1="14.5" x2="20" y2="19" stroke="#737373" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="btn btn-dark">부원 추가</button>
        </div>
      </div>

      <div class="card-list" id="cardList">
        <!-- Cards generated by JS -->
      </div>

      <button class="cta-btn cta-black">과제 제출: 3/21(토) 22:00까지</button>
    </div>
  </section>

  <script>
    // ========== TOP BAR SCROLL BEHAVIOR ==========
    let lastScrollY = window.scrollY;
    const topBar = document.getElementById('topBar');

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY > lastScrollY && currentScrollY > 72) {
        topBar.classList.add('hidden');
      } else {
        topBar.classList.remove('hidden');
      }
      lastScrollY = currentScrollY;
    });

    // ========== GENERATE MEMBER CARDS ==========
    const members = [
      { name: '김앰퍼', tags: ['Product Design', 'Product Design'] },
      { name: '이앰퍼', tags: ['Product Design', 'Product Design'] },
      { name: '박앰퍼', tags: ['Product Design', 'Product Design'] },
      { name: '신앰퍼', tags: ['Product Design', 'Product Design'] },
      { name: '최앰퍼', tags: ['Product Design', 'Product Design'] },
      { name: '강앰퍼', tags: ['Product Design', 'Product Design'] },
    ];

    const editIcon = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 19h1.4l8.625-8.625-1.4-1.4L5 17.6V19ZM19.3 8.925l-4.25-4.2 1.4-1.4a1.92 1.92 0 0 1 1.413-.577 1.92 1.92 0 0 1 1.412.577l1.4 1.4c.383.383.583.846.6 1.388a1.806 1.806 0 0 1-.55 1.387L19.3 8.925ZM4 21a.967.967 0 0 1-.712-.288A.968.968 0 0 1 3 20v-2.825a.98.98 0 0 1 .075-.387.946.946 0 0 1 .225-.338l12.15-12.15 4.25 4.25-12.15 12.15a.946.946 0 0 1-.338.225.98.98 0 0 1-.387.075H4Z" fill="#DCDCDC"/>
    </svg>`;

    const cardList = document.getElementById('cardList');

    members.forEach(member => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-top">
            <div class="card-name-row">
              <span class="card-name">${member.name}</span>
              <button class="detail-btn" aria-label="더보기">
                <div class="detail-dots">
                  <span></span><span></span><span></span>
                </div>
              </button>
            </div>
            <div class="tag-list">
              ${member.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="card-goal">
            <div class="card-goal-header">
              <span class="card-goal-title">학습 목표</span>
              <button class="edit-btn" aria-label="수정">${editIcon}</button>
            </div>
            <p class="card-goal-text">이번 세션 과제를 통해 오토레이아웃을 활용해 콘텐츠 변화에 유연하게 대응하는 레이아웃 구조를 잡고, 개발 가능한 형태로 화면을 정리하는 감각을 익힌다.</p>
          </div>
        </div>
      `;
      cardList.appendChild(card);
    });
  </script>
</body>
</html>
